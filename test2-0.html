<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Currency Converter</title>
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }

        .For-Whole-page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .Heading {
            color: #f43f5e;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
            text-align: center;
        }

        .card-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
        }

        .For-Display-Flex {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .For-Display-Flex label {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #Currency-taker,
        #Currency-selector {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            margin-bottom: 20px;
            background-color: rgba(15, 23, 42, 0.8);
            color: white;
            border: 2px solid #334155;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
        }

        #Currency-taker:focus,
        #Currency-selector:focus {
            border-color: #f43f5e;
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.15);
        }

        #Currency-selector {
            cursor: pointer;
        }

        .result-box {
            margin-top: 10px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 14px;
            text-align: center;
        }

        .result-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        #changing_paragh {
            font-size: 24px;
            font-weight: 700;
            color: #38bdf8;
            margin-top: 0;
        }
    </style>
</head>

<body>
    <div class="For-Whole-page">
        <h1 class="Heading">Currency Converter</h1>

        <div class="card-container">
            <div class="For-Display-Flex">
                <label for="Currency-taker">Value to convert:</label>
                <input id="Currency-taker" min="0" placeholder="Enter number..." type="number"
                    oninput="convertCurrency()">

                <label for="Currency-selector">Choose Currency:</label>
                <select id="Currency-selector" onchange="convertCurrency()">
                    <option value="dollar">Dollar ($)</option>
                    <option value="euro">Euro (€)</option>
                    <option value="yen">Yen (¥)</option>
                    <option value="pound">Pound (£)</option>
                    <option value="renminbi">Renminbi (¥)</option>
                </select>
            </div>

            <div class="result-box">
                <div class="result-label">Converted Amount</div>
                <p id="changing_paragh">0.00 Pkr</p>
            </div>
        </div>
    </div>

    <script>
        function convertCurrency() {
            let amount = document.getElementById("Currency-taker").value;
            let currency = document.getElementById("Currency-selector").value;

            let result = 0;

            if (amount < 0) {
                document.getElementById("changing_paragh").innerHTML = "Please enter a positive number!";
                return;
            }

            if (amount === "") {
                document.getElementById("changing_paragh").innerHTML = "0.00 Pkr";
                return;
            }

            if (currency === "dollar") {
                result = amount * 280.82;
            } else if (currency === "euro") {
                result = amount * 309.69;
            } else if (currency === "yen") {
                result = amount * 1.75;
            } else if (currency === "pound") {
                result = amount * 366.38;
            } else if (currency === "renminbi") {
                result = amount * 41.36;
            }

            document.getElementById("changing_paragh").innerHTML = result.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " Pkr";
        }
    </script>
</body>

</html>
